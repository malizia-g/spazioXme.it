[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect dall'apex al www (URL canonico coerente con site.json)
[[redirects]]
  from = "https://spazioxme.it/*"
  to = "https://www.spazioxme.it/:splat"
  status = 301
  force = true

# Pagina 404 personalizzata
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Header di sicurezza e cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.openstreetmap.org; form-action 'self'; base-uri 'self'; object-src 'none'"

# Cache lunga per asset con contenuto stabile
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/ottimizzate/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
